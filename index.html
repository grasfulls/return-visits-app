<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Return Visits App</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-container">
      <header>
        <h1>Return Visits</h1>
        <div id="filters-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Search contacts or notes..."
          />
          <select id="filter-urgency">
            <option value="">All Urgency</option>
            <option value="Normal">Normal (0-7d)</option>
            <option value="Urgent">Urgent (8-14d)</option>
            <option value="Immediate">Immediate (&ge; 15d)</option>
          </select>
          <select id="filter-city">
            <option value="">All Cities</option>
          </select>
          <select id="filter-area">
            <option value="">All Areas</option>
          </select>
          <select id="sort-select">
            <option value="chronological-desc">Newest First</option>
            <option value="chronological-asc">Oldest First</option>
            <option value="alphabetical">Alphabetical</option>
          </select>
        </div>
      </header>

      <main>
        <!-- Contacts View -->
        <div id="contacts-view" class="view active">
          <button id="btn-open-modal">➕ Add Contact</button>
          <div id="contacts-list"></div>
        </div>

        <!-- Map View -->
        <div id="map-view" class="view">
          <div id="map"></div>
        </div>

        <!-- Settings View -->
        <div id="settings-view" class="view">
          <div class="settings-container">
            <h2>Settings & Master Lists</h2>
            <p>
              Contacts and settings are stored on this device in this browser.
              Export a backup file regularly to keep a separate copy.
            </p>
            <button type="button" id="btn-export-backup">
              ⬇️ Export Data Backup
            </button>
            <form id="settings-form">
              <label>Default State:</label>
              <input type="text" id="setting-state" />

              <label>Default City:</label>
              <input type="text" id="setting-default-city" />

              <label>Default Area:</label>
              <input type="text" id="setting-default-area" />

              <button
                type="submit"
                style="
                  background: #28a745;
                  color: white;
                  padding: 10px;
                  border: none;
                  border-radius: 4px;
                  cursor: pointer;
                "
              >
                💾 Save Settings
              </button>
            </form>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc" />

            <h3>Add New City to List</h3>
            <div style="display: flex; gap: 8px">
              <input
                type="text"
                id="setting-new-city"
                placeholder="New city name..."
              />
              <button
                type="button"
                id="btn-add-setting-city"
                style="
                  background: #004080;
                  color: white;
                  border: none;
                  padding: 8px 14px;
                  border-radius: 4px;
                  cursor: pointer;
                "
              >
                Add City
              </button>
            </div>

            <h3 style="margin-top: 15px">Add New Area to List</h3>
            <div style="display: flex; gap: 8px">
              <input
                type="text"
                id="setting-new-area"
                placeholder="New area name..."
              />
              <button
                type="button"
                id="btn-add-setting-area"
                style="
                  background: #004080;
                  color: white;
                  border: none;
                  padding: 8px 14px;
                  border-radius: 4px;
                  cursor: pointer;
                "
              >
                Add Area
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Bottom Navigation Bar -->
      <nav id="bottom-nav"></nav>
    </div>

    <!-- Add/Edit Contact Modal -->
    <div id="contact-modal" class="modal">
      <div class="modal-content">
        <span id="close-modal">&times;</span>
        <div class="modal-header">
          <h2 id="modal-title">Add Contact</h2>
        </div>

        <form id="contact-form" class="modal-form-container">
          <input type="hidden" id="contact-id" />

          <div class="modal-body">
            <label>First Name:</label>
            <input type="text" id="contact-firstname" required />

            <label>Last Name:</label>
            <input type="text" id="contact-lastname" />

            <label>Street Address:</label>
            <input type="text" id="contact-address" />

            <label>City:</label>
            <select id="contact-city-select"></select>
            <div id="new-city-container" style="display: none; margin-top: 6px">
              <div style="display: flex; gap: 6px">
                <input
                  type="text"
                  id="input-new-city"
                  placeholder="Enter new city name..."
                />
                <button
                  type="button"
                  id="btn-save-new-city"
                  style="
                    background: #28a745;
                    color: white;
                    border: none;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;
                  "
                >
                  Add
                </button>
                <button
                  type="button"
                  id="btn-cancel-new-city"
                  style="
                    background: #6c757d;
                    color: white;
                    border: none;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;
                  "
                >
                  Cancel
                </button>
              </div>
            </div>

            <label>State:</label>
            <input type="text" id="contact-state" />

            <label>Area / Zone:</label>
            <select id="contact-area-select"></select>
            <div id="new-area-container" style="display: none; margin-top: 6px">
              <div style="display: flex; gap: 6px">
                <input
                  type="text"
                  id="input-new-area"
                  placeholder="Enter new area name..."
                />
                <button
                  type="button"
                  id="btn-save-new-area"
                  style="
                    background: #28a745;
                    color: white;
                    border: none;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;
                  "
                >
                  Add
                </button>
                <button
                  type="button"
                  id="btn-cancel-new-area"
                  style="
                    background: #6c757d;
                    color: white;
                    border: none;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;
                  "
                >
                  Cancel
                </button>
              </div>
            </div>

            <div class="gps-row">
              <label>Latitude: <input type="text" id="contact-lat" /></label>
              <label>Longitude: <input type="text" id="contact-lng" /></label>
              <button type="button" id="btn-gps">📍 Get GPS</button>
            </div>

            <!-- Interactive Map Pin Picker inside Modal -->
            <label style="margin-top: 10px"
              >Click Map to Pin Exact Location:</label
            >
            <div
              id="modal-picker-map"
              style="
                height: 180px;
                width: 100%;
                border-radius: 4px;
                border: 1px solid #ccc;
                margin-bottom: 10px;
              "
            ></div>

            <label>Visit Logs (Click Edit to modify date/time/note):</label>
            <div
              id="modal-notes-history-container"
              style="
                margin-bottom: 10px;
                max-height: 200px;
                overflow-y: auto;
                background: #f8f9fa;
                border: 1px solid #ddd;
                padding: 8px;
                border-radius: 4px;
              "
            ></div>

            <label>Add New Visit Log:</label>
            <div class="new-log-timestamp-row">
              <input
                type="datetime-local"
                id="new-log-timestamp"
                style="flex: 1; min-width: 0;"
              />
            </div>
            <textarea
              id="contact-notes"
              rows="2"
              placeholder="Note text for new visit..."
            ></textarea>

            <!-- Bottom spacer to ensure full visibility above sticky footer -->
            <div style="height: 60px"></div>
          </div>

          <!-- Sticky Footer Action Bar Inside Modal Form -->
          <div class="modal-sticky-footer">
            <button type="submit" id="btn-save-contact" title="Save Contact">
              💾 Save
            </button>
            <button type="button" id="btn-exit-modal" title="Exit / Cancel">
              ❌ Exit
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
